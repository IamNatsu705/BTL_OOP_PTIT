<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Quản lý Lịch Sân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body class="bg-gray-100 text-gray-800 font-sans h-screen flex overflow-hidden">
    <aside class="bg-gray-800 text-gray-300 w-64 transition-all duration-300 flex flex-col flex-shrink-0">
      <div class="flex items-center justify-center h-16 border-b border-gray-700 gap-3">
        <i data-lucide="shield-check" class="w-6 h-6 text-blue-500"></i>
        <span class="text-xl font-bold text-white tracking-wide">Quản Trị</span>
      </div>
      <nav class="flex-1 px-4 py-6 space-y-2">
        <a th:href="@{/admin}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
          <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
          <span class="ml-3">Tổng quan</span>
        </a>
        <a th:href="@{/admin/courts}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors bg-blue-600 text-white">
          <i data-lucide="calendar" class="w-5 h-5"></i>
          <span class="ml-3">Quản lý Lịch Sân</span>
        </a>
        <a th:href="@{/admin/pricing}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
          <i data-lucide="tag" class="w-5 h-5"></i>
          <span class="ml-3">Quản lý Giá</span>
        </a>
        <a th:href="@{/admin/customers}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
          <i data-lucide="users" class="w-5 h-5"></i>
          <span class="ml-3">Khách hàng</span>
        </a>
      </nav>
      <div class="px-4 py-4 border-t border-gray-700">
        <a th:href="@{/logout}" class="flex items-center w-full px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white">
          <i data-lucide="log-out" class="w-5 h-5"></i>
          <span class="ml-3">Đăng xuất</span>
        </a>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <header class="bg-white shadow-sm border-b border-gray-200 h-16 flex-shrink-0">
        <div class="flex items-center justify-between h-full px-6" th:if="${isAuthenticated}">
          <button class="text-gray-600"><i data-lucide="menu"></i></button>
          <div class="flex items-center space-x-4">
            <span class="text-gray-700 font-medium" th:text="'Chào, ' + ${currentUser}">Admin</span>
          </div>
        </div>
      </header>

      <main class="flex-1 flex flex-col p-4 sm:p-6 overflow-hidden bg-gray-100">
        <div class="flex flex-col md:flex-row justify-between items-end md:items-center gap-4 bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-4 flex-shrink-0">
          <div class="flex gap-6 text-sm">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-green-300 border border-gray-400"></span>
              <span class="text-gray-600">
                Đã đặt:
                <b class="text-gray-900 text-base ml-1" id="countBooked">0</b>
              </span>
            </div>
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-gray-300 border border-gray-400"></span>
              <span class="text-gray-600">
                Trống:
                <b class="text-gray-900 text-base ml-1" id="countFree">0</b>
              </span>
            </div>
          </div>

          <div class="flex items-center bg-gray-50 rounded-lg p-1 border border-gray-200">
            <button onclick="changeDate(-1)" class="p-2 hover:bg-white rounded-md text-gray-500 hover:text-blue-600 transition-all">
              <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <input
              type="date"
              id="selectedDate"
              class="bg-transparent border-none text-sm font-bold text-gray-700 focus:ring-0 cursor-pointer text-center w-32 outline-none mx-2"
            />
            <button onclick="changeDate(1)" class="p-2 hover:bg-white rounded-md text-gray-500 hover:text-blue-600 transition-all">
              <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <div class="bg-white border border-gray-200 rounded-xl shadow-sm flex-1 overflow-auto relative w-full">
          <table class="min-w-full border-separate border-spacing-0 text-sm">
            <thead class="bg-gray-50 sticky top-0 z-20 shadow-sm">
              <tr>
                <th class="sticky left-0 top-0 z-30 bg-gray-50 border-b border-r border-gray-200 px-4 py-3 text-gray-600 font-bold text-center min-w-[100px]">Sân / Giờ</th>
                <th
                  th:each="c : ${#numbers.sequence(0,23)}"
                  class="sticky top-0 z-20 bg-gray-50 border-b border-r border-gray-200 px-2 py-3 font-medium text-gray-500 min-w-[80px] text-center"
                >
                  <span th:text="${c < 10 ? '0'+c : c}"></span>
                  :00
                </th>
              </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-100">
              <tr th:each="court : ${#numbers.sequence(1,6)}">
                <td class="sticky left-0 z-10 bg-white border-r border-b border-gray-100 px-4 py-3 font-bold text-blue-600 text-center shadow-[4px_0_10px_-4px_rgba(0,0,0,0.1)]">
                  Sân
                  <span th:text="${court}"></span>
                </td>
                <td
                  th:each="slot : ${#numbers.sequence(0,23)}"
                  th:id="${court + '_' + slot}"
                  class="border-r border-b border-gray-100 p-1 relative h-16 min-w-[80px] transition-colors"
                ></td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <div id="bookingModal" class="fixed inset-0 z-50 hidden" role="dialog">
      <div class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm" onclick="closeModal()"></div>
      <div class="flex min-h-full items-center justify-center p-4 absolute inset-0 pointer-events-none">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md pointer-events-auto transform transition-all">
          <div class="bg-blue-600 px-6 py-4 rounded-t-xl flex justify-between items-center text-white">
            <h3 class="font-bold flex items-center gap-2">
              <i data-lucide="info" class="w-5 h-5"></i>
              Chi tiết
            </h3>
            <button onclick="closeModal()" class="hover:bg-blue-700 p-1 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div class="p-6 space-y-4">
            <div class="flex items-center gap-4">
              <div class="h-12 w-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-lg" id="modalAvatar">U</div>
              <div>
                <p class="text-xs text-gray-400 font-bold uppercase">Khách hàng</p>
                <h4 class="text-lg font-bold text-gray-800" id="modalName">...</h4>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4 pt-4 border-t border-gray-100">
              <div>
                <p class="text-xs text-gray-500">Số điện thoại</p>
                <p class="font-medium" id="modalPhone">...</p>
              </div>
              <div>
                <p class="text-xs text-gray-500">Giá tiền</p>
                <p class="font-bold text-green-600" id="modalPrice">...</p>
              </div>
              <div class="col-span-2">
                <p class="text-xs text-gray-500">Thời gian</p>
                <p class="font-medium" id="modalTime">...</p>
              </div>
            </div>
          </div>
          <div class="bg-gray-50 px-6 py-4 rounded-b-xl text-right">
            <button onclick="closeModal()" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 font-medium hover:bg-gray-100">Đóng</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      lucide.createIcons();
      const dateInput = document.getElementById("selectedDate");
      const modal = document.getElementById("bookingModal");

      // Class tailwind
      const cls_base = "border-r border-b border-gray-100 h-16 min-w-[80px] p-1 relative transition-colors text-center";
      const cls_empty = cls_base + " hover:bg-gray-50 cursor-default";
      const cls_past = cls_base + " bg-gray-200 cursor-not-allowed text-gray-500";
      const cls_booked = cls_base + " bg-emerald-50 border-emerald-100 cursor-pointer hover:bg-emerald-100 text-emerald-800";
      const cls_booked_past = cls_base + " bg-gray-300 border-gray-400 cursor-pointer text-gray-600"; // Booked nhưng đã qua

      const tableDOM = [];

      function initTableDOM() {
        for (let c = 1; c <= 6; c++) {
          const row = [];
          for (let s = 0; s < 24; s++) {
            const cell = document.getElementById(c + "_" + s); // Dùng cộng chuỗi
            row.push(cell);
          }
          tableDOM.push(row);
        }
      }

      dateInput.value = new Date().toLocaleDateString("en-CA");

      function changeDate(days) {
        const d = new Date(dateInput.value);
        d.setDate(d.getDate() + days);
        dateInput.value = d.toLocaleDateString("en-CA");
        loadSchedule();
      }
      let countRequest = 0;
      async function loadSchedule() {
        let thisRequest = countRequest + 1;
        countRequest++;
        const selectedDateStr = dateInput.value;
        const selectedDate = new Date(selectedDateStr);
        selectedDate.setHours(0, 0, 0, 0);

        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const currentHour = new Date().getHours();

        // Kiểm tra xem ngày chọn có phải quá khứ không
        const isPastDate = selectedDate < today;
        const isToday = selectedDate.getTime() === today.getTime();

        let count = 0;

        // 1. Reset về mặc định
        for (let r = 0; r < tableDOM.length; r++) {
          for (let c = 0; c < tableDOM[r].length; c++) {
            const cell = tableDOM[r][c];
            if (cell) {
              cell.innerHTML = "";
              cell.onclick = null;

              // Logic check quá khứ
              if (isPastDate || (isToday && c < currentHour)) {
                cell.className = cls_past;
              } else {
                cell.className = cls_empty;
              }
            }
          }
        }

        try {
          const res = await fetch("/slots/booked?date=" + selectedDateStr);
          const data = await res.json();
          if (thisRequest !== countRequest) {
            console.log("Dữ liệu cũ, bỏ qua render: ");
            return;
          }
          data.forEach((item) => {
            count++;
            const court = (item.courId || item.courtId) - 1;
            const slot = item.slotId - 1;

            if (tableDOM[court] && tableDOM[court][slot]) {
              const cell = tableDOM[court][slot];

              // Check xem booking này đã qua giờ chưa để chỉnh màu
              const isBookingPast = isPastDate || (isToday && slot < currentHour);

              if (isBookingPast) {
                cell.className = cls_booked_past;
              } else {
                cell.className = cls_booked;
              }

              const price = new Intl.NumberFormat("vi-VN").format(item.price);
              cell.innerHTML =
                '<div class="w-full h-full flex flex-col items-center justify-center overflow-hidden">' +
                '<span class="text-[11px] font-bold truncate w-full px-1">' +
                item.fullName +
                "</span>" +
                '<span class="text-[10px] font-mono opacity-80">' +
                price +
                "đ</span>" +
                "</div>";

              cell.onclick = function () {
                document.getElementById("modalName").innerText = item.fullName;
                document.getElementById("modalAvatar").innerText = item.fullName.charAt(0).toUpperCase();
                document.getElementById("modalPhone").innerText = item.phone;
                document.getElementById("modalPrice").innerText = price + " đ";
                document.getElementById("modalTime").innerText = "Sân " + (court + 1) + " • " + slot + ":00 - " + (slot + 1) + ":00";
                modal.classList.remove("hidden");
              };
            }
          });

          document.getElementById("countBooked").innerText = count;
          document.getElementById("countFree").innerText = 6 * 24 - count;
        } catch (e) {
          console.error("Lỗi tải lịch:", e);
        }
      }

      function closeModal() {
        modal.classList.add("hidden");
      }

      dateInput.addEventListener("change", loadSchedule);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      initTableDOM();
      loadSchedule();
    </script>
  </body>
</html>
