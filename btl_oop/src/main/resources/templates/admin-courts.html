<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Quản lý Sân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <div class="flex h-screen">
      <!-- SIDEBAR -->
      <aside class="bg-gray-800 text-gray-300 w-64 transition-all duration-300 flex flex-col flex-shrink-0">
        <div class="flex items-center justify-center h-16 border-b border-gray-700">
          <span class="text-xl font-bold text-white">Quản Trị</span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
          <a th:href="@{/admin}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
            <span class="ml-3">Tổng quan</span>
          </a>
          <a th:href="@{/admin/courts}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors bg-blue-600 text-white">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span class="ml-3">Quản lý Sân</span>
          </a>
          <a th:href="@{/admin/pricing}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="tag" class="w-5 h-5"></i>
            <span class="ml-3">Quản lý Giá</span>
          </a>
          <a href="#" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="credit-card" class="w-5 h-5"></i>
            <span class="ml-3">Doanh thu</span>
          </a>
          <a th:href="@{/admin/customers}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="users" class="w-5 h-5"></i>
            <span class="ml-3">Khách hàng</span>
          </a>
          <a th:href="@{/admin/comments}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="message-square" class="w-5 h-5"></i>
            <span class="ml-3">Bình luận</span>
          </a>
        </nav>
        <div class="px-4 py-4 border-t border-gray-700">
          <a th:href="@{/logout}" class="flex items-center w-full px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="log-out" class="w-5 h-5"></i>
            <span class="ml-3">Đăng xuất</span>
          </a>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <!-- HEADER -->
        <header class="bg-white shadow-sm border-b border-gray-200">
          <div class="flex items-center justify-between h-16 px-6" th:if="${isAuthenticated}">
            <button class="text-gray-600">
              <i data-lucide="menu"></i>
            </button>
            <div class="flex items-center space-x-4">
              <span class="text-gray-700 font-medium" th:text="'Chào, ' + ${currentUser}">Chào, Quản Trị Viên</span>
            </div>
          </div>
        </header>

        <main class="m-3 flex-1 overflow-auto hide-scrollbar">
          <h1 class="text-3xl text-gray-800 mb-5">Lịch đặt sân</h1>
          <div class="flex gap-3 mb-4 items-center">
            <h3 class="font-medium">Ngày :</h3>
            <input type="date" id="selectedDate" name="selectedDate" value="2025-11-18" class="bg-transparent border border-gray-300 px-2 py-1 rounded" />
          </div>
          <!-- Bảng đặt sân -->
          <div class="overflow-auto border rounded-lg shadow bg-white hide-scrollbar">
            <table class="min-w-full border border-gray-300 text-sm border-separate border-spacing-[1px]">
              <thead class="bg-blue-50">
                <tr>
                  <!-- Cột đầu tiên (sticky) -->
                  <th class="sticky left-0 z-20 bg-blue-100 border border-gray-300 px-4 py-3 text-gray-700 font-semibold text-center shadow-md">Sân</th>

                  <th th:each="c : ${#numbers.sequence(0,23)}" class="border border-gray-300 px-4 py-3 font-semibold text-gray-700 text-center bg-blue-50">
                    <div th:if="${c>9}" class="flex items-center justify-center font-mono">
                      00:
                      <span th:text="${c}"></span>
                      h
                    </div>
                    <div th:if="${c<10}" class="flex items-center justify-center font-mono">
                      00:0
                      <span th:text="${c}"></span>
                      h
                    </div>
                  </th>
                </tr>
              </thead>

              <tbody>
                <tr th:each="court : ${#numbers.sequence(1,6)}" class="odd:bg-white even:bg-gray-50">
                  <!-- Cột đầu tiên sticky -->
                  <td class="sticky left-0 z-10 bg-white border border-gray-300 px-4 py-3 font-semibold text-blue-600 text-center shadow-md">
                    <div class="flex gap-2 justify-center">
                      Sân
                      <p th:text="${court}"></p>
                    </div>
                  </td>

                  <td
                    th:each="slot : ${#numbers.sequence(0,23)}"
                    th:id="${court + '_' + slot}"
                    th:data-court="${court}"
                    th:data-slot="${slot}"
                    th:title="'Khách: ' +'Dương Xuân Quỳnh'+ '&#10;Sđt: ' + '0339464705'"
                    class="border border-gray-300 px-4 py-3 text-center font-mono hover:bg-blue-100 cursor-pointer transition select-none rounded"
                  ></td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Note -->
          <div class="flex justify-end gap-3 mr-4 mt-4">
            <div class="flex text-[14px] items-center gap-2">
              <div class="w-3 h-3 border-0 rounded-full bg-gray-400"></div>
              <div>Sân khóa</div>
            </div>
            <div class="flex text-[14px] items-center gap-2">
              <div class="w-3 h-3 border-0 rounded-full bg-green-400"></div>
              <div>Sân đã được thuê</div>
            </div>
            <div class="flex text-[14px] items-center gap-2">
              <div class="w-3 h-3 border-[1px] border-gray-800 rounded-full bg-white"></div>
              <div>Sân trống</div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
