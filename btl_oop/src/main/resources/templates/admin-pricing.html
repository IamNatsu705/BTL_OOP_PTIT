<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Cấu hình Giá</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body class="bg-gray-100 text-gray-800 font-sans h-screen flex overflow-hidden">
    <aside class="bg-gray-800 text-gray-300 w-64 transition-all duration-300 flex flex-col flex-shrink-0">
      <div class="flex items-center justify-center h-16 border-b border-gray-700 gap-3">
        <i data-lucide="shield-check" class="w-6 h-6 text-blue-500"></i>
        <span class="text-xl font-bold text-white tracking-wide">Quản Trị</span>
      </div>
      <nav class="flex-1 px-4 py-6 space-y-2">
        <a th:href="@{/admin}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
          <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
          <span class="ml-3">Tổng quan</span>
        </a>
        <a th:href="@{/admin/courts}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
          <i data-lucide="calendar" class="w-5 h-5"></i>
          <span class="ml-3">Quản lý Lịch Sân</span>
        </a>
        <a th:href="@{/admin/pricing}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors bg-blue-600 text-white">
          <i data-lucide="tag" class="w-5 h-5"></i>
          <span class="ml-3">Quản lý Giá</span>
        </a>
        <a th:href="@{/admin/customers}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
          <i data-lucide="users" class="w-5 h-5"></i>
          <span class="ml-3">Khách hàng</span>
        </a>
      </nav>
      <div class="px-4 py-4 border-t border-gray-700">
        <a th:href="@{/logout}" class="flex items-center w-full px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white">
          <i data-lucide="log-out" class="w-5 h-5"></i>
          <span class="ml-3">Đăng xuất</span>
        </a>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <header class="bg-white shadow-sm border-b border-gray-200 h-16 flex-shrink-0">
        <div class="flex items-center justify-between h-full px-6" th:if="${isAuthenticated}">
          <button class="text-gray-600"><i data-lucide="menu"></i></button>
          <div class="flex items-center space-x-4">
            <span class="text-gray-700 font-medium" th:text="'Chào, ' + ${currentUser}">Admin</span>
          </div>
        </div>
      </header>

      <main class="flex-1 flex flex-col p-6 overflow-hidden bg-gray-100">
        <div class="flex flex-col md:flex-row gap-6 h-full overflow-hidden">
          <div class="w-full md:w-1/3 flex flex-col gap-4">
            <div class="bg-white p-4 rounded border border-gray-200 shadow-sm">
              <h3 class="font-bold text-lg mb-2 flex items-center gap-2 text-gray-800">
                <i data-lucide="settings" class="w-5 h-5 text-gray-500"></i>
                Các mức giá
              </h3>
              <p class="text-sm text-gray-500 mb-4">Định nghĩa giá tiền cho từng loại (Thường, VIP...).</p>

              <div class="space-y-3">
                <div th:each="type : ${typeSlots}" class="p-3 bg-gray-50 border border-gray-200 rounded">
                  <form th:action="@{/admin/pricing/update}" method="post" class="flex flex-col gap-2">
                    <input type="hidden" name="id" th:value="${type.id}" />

                    <div class="flex justify-between font-bold text-sm text-gray-700">
                      <span th:text="${type.name}">Tên Loại</span>
                    </div>

                    <div class="flex gap-2">
                      <input
                        type="number"
                        name="price"
                        th:value="${type.price}"
                        class="w-full border border-gray-300 p-2 rounded text-right font-mono text-blue-700 font-bold focus:border-blue-500 outline-none"
                        required
                      />
                      <button type="submit" class="px-3 bg-white border border-gray-300 rounded hover:bg-gray-100 text-blue-600" title="Lưu">
                        <i data-lucide="save" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>

          <div class="w-full md:w-2/3 flex flex-col bg-white border border-gray-200 rounded shadow-sm overflow-hidden">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
              <div>
                <h3 class="font-bold text-lg text-gray-800">Cấu hình Khung giờ</h3>
                <p class="text-xs text-gray-500">Gán mức giá cho từng giờ trong ngày</p>
              </div>
              <button
                onclick="document.getElementById('scheduleForm').submit()"
                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-bold text-sm flex items-center gap-2 shadow-sm"
              >
                <i data-lucide="check-circle" class="w-4 h-4"></i>
                Lưu cấu hình
              </button>
            </div>

            <div class="flex-1 overflow-y-auto p-0">
              <form id="scheduleForm" th:action="@{/admin/pricing/configure}" method="post">
                <table class="w-full text-left border-collapse text-sm">
                  <thead class="bg-gray-100 sticky top-0 z-10 text-gray-600 uppercase text-xs">
                    <tr>
                      <th class="px-6 py-3 border-b border-gray-200">Khung giờ</th>
                      <th class="px-6 py-3 border-b border-gray-200">Mức giá áp dụng</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-gray-100">
                    <tr th:each="slot : ${slots}" class="hover:bg-gray-50">
                      <td class="px-6 py-3 font-mono font-bold text-gray-700">
                        <span th:text="${slot.timeBegin < 10 ? '0'+slot.timeBegin : slot.timeBegin}"></span>
                        :00 -
                        <span th:text="${slot.timeEnd < 10 ? '0'+slot.timeEnd : slot.timeEnd}"></span>
                        :00
                      </td>
                      <td class="px-6 py-2">
                        <select th:name="'slot_' + ${slot.id}" class="w-full border border-gray-300 rounded p-2 bg-white focus:border-blue-500 outline-none cursor-pointer">
                          <option
                            th:each="type : ${typeSlots}"
                            th:value="${type.id}"
                            th:text="${type.name} + ' - ' + ${#numbers.formatDecimal(type.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                            th:selected="${slot.typeSlots.id == type.id}"
                          ></option>
                        </select>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      lucide.createIcons();

      // Hiển thị thông báo khi URL có ?success
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has("success")) {
        alert("Đã lưu cấu hình thành công!");
        // Xóa param trên url để F5 không hiện lại
        window.history.replaceState({}, document.title, "/admin/pricing");
      }
    </script>
  </body>
</html>
