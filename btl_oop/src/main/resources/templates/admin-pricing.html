<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Cấu hình Giá</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      /* Style cho select option để dễ nhìn */
      option.type-1 {
        background-color: #f0fdf4;
        color: #166534;
      } /* Xanh lá nhẹ */
      option.type-2 {
        background-color: #fffbeb;
        color: #92400e;
        font-weight: bold;
      } /* Vàng đậm */
      option.type-3 {
        background-color: #fef2f2;
        color: #991b1b;
        font-weight: bold;
      } /* Đỏ đậm */
    </style>
  </head>
  <body class="bg-gray-100">
    <div class="flex h-screen">
      <aside class="bg-gray-800 text-gray-300 w-64 flex flex-col flex-shrink-0">
        <div class="flex items-center justify-center h-16 border-b border-gray-700">
          <span class="text-xl font-bold text-white">Quản Trị</span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
          <a th:href="@{/admin}" class="flex items-center w-full px-4 py-2 rounded-lg hover:bg-gray-700">
            <i data-lucide="bar-chart-2" class="w-5 h-5 mr-3"></i>
            Tổng quan
          </a>
          <a th:href="@{/admin/courts}" class="flex items-center w-full px-4 py-2 rounded-lg hover:bg-gray-700">
            <i data-lucide="calendar" class="w-5 h-5 mr-3"></i>
            Lịch Sân
          </a>
          <a th:href="@{/admin/pricing}" class="flex items-center w-full px-4 py-2 rounded-lg bg-blue-600 text-white">
            <i data-lucide="tag" class="w-5 h-5 mr-3"></i>
            Quản lý Giá
          </a>
          <a th:href="@{/admin/customers}" class="flex items-center w-full px-4 py-2 rounded-lg hover:bg-gray-700">
            <i data-lucide="users" class="w-5 h-5 mr-3"></i>
            Khách hàng
          </a>
        </nav>
        <div class="px-4 py-4 border-t border-gray-700">
          <a th:href="@{/logout}" class="flex items-center w-full px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="log-out" class="w-5 h-5"></i>
            <span class="ml-3">Đăng xuất</span>
          </a>
        </div>
      </aside>

      <div class="flex-1 flex flex-col overflow-hidden">
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
          <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
              <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 sticky top-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                  <i data-lucide="dollar-sign" class="text-green-600 w-5 h-5"></i>
                  Bảng Giá Cơ Sở
                </h2>
                <p class="text-sm text-gray-500 mb-4">Cập nhật giá tiền cho 3 mức giá cố định.</p>

                <div class="space-y-4">
                  <div th:each="type : ${typeSlots}" class="border rounded-lg p-3 bg-gray-50">
                    <form th:action="@{/admin/pricing/update}" method="post">
                      <input type="hidden" name="id" th:value="${type.id}" />
                      <div class="flex justify-between items-center mb-1">
                        <span class="font-semibold text-gray-700 text-sm" th:text="${type.name}">Mức 1</span>
                        <span th:if="${typeStat.index == 0}" class="w-2 h-2 rounded-full bg-green-500"></span>
                        <span th:if="${typeStat.index == 1}" class="w-2 h-2 rounded-full bg-yellow-500"></span>
                        <span th:if="${typeStat.index == 2}" class="w-2 h-2 rounded-full bg-red-500"></span>
                      </div>
                      <div class="flex gap-2 mt-2">
                        <input
                          type="number"
                          name="price"
                          th:value="${type.price}"
                          class="w-full px-3 py-1.5 border border-gray-300 rounded text-right font-mono font-bold text-blue-600 text-sm focus:ring-1 focus:ring-blue-500 outline-none"
                        />
                        <button type="submit" class="bg-white border border-gray-300 text-gray-600 px-2 rounded hover:bg-gray-100" title="Lưu">
                          <i data-lucide="save" class="w-4 h-4"></i>
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>

            <div class="lg:col-span-2">
              <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="flex justify-between items-center mb-6">
                  <div>
                    <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                      <i data-lucide="calendar-clock" class="text-blue-600"></i>
                      Cấu hình Khung Giờ
                    </h2>
                    <p class="text-sm text-gray-500 mt-1">Chọn mức giá áp dụng cho từng khung giờ trong ngày.</p>
                  </div>
                  <button
                    onclick="document.getElementById('scheduleForm').submit()"
                    class="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-bold shadow-md hover:bg-blue-700 transition flex items-center gap-2 animate-pulse"
                  >
                    <i data-lucide="save" class="w-5 h-5"></i>
                    Lưu Cấu Hình
                  </button>
                </div>

                <form id="scheduleForm" th:action="@{/admin/pricing/configure}" method="post">
                  <div class="overflow-hidden border rounded-lg">
                    <table class="min-w-full divide-y divide-gray-200">
                      <thead class="bg-gray-50">
                        <tr>
                          <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-1/3">Khung Giờ</th>
                          <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-2/3">Chọn Mức Giá Áp Dụng</th>
                        </tr>
                      </thead>
                      <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="slot : ${slots}" class="hover:bg-gray-50 transition">
                          <td class="px-6 py-3 whitespace-nowrap">
                            <div class="flex items-center">
                              <div class="bg-blue-100 text-blue-800 font-mono font-bold px-2.5 py-1 rounded text-sm">
                                <span th:text="${slot.timeBegin < 10 ? '0'+slot.timeBegin : slot.timeBegin}"></span>
                                :00 -
                                <span th:text="${slot.timeEnd < 10 ? '0'+slot.timeEnd : slot.timeEnd}"></span>
                                :00
                              </div>
                            </div>
                          </td>
                          <td class="px-6 py-2 whitespace-nowrap">
                            <select
                              th:name="'slot_' + ${slot.id}"
                              class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md border cursor-pointer"
                              onchange="updateColor(this)"
                            >
                              <option
                                th:each="type, stat : ${typeSlots}"
                                th:value="${type.id}"
                                th:text="${type.name} + ' (' + ${#numbers.formatDecimal(type.price, 0, 'COMMA', 0, 'POINT')} + 'đ)'"
                                th:selected="${slot.typeSlots.id == type.id}"
                                th:class="'type-' + ${stat.count}"
                              ></option>
                            </select>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script>
      lucide.createIcons();

      // Hàm đổi màu select box khi chọn giá trị khác nhau cho trực quan
      function updateColor(select) {
        // Logic đổi màu background nhẹ cho select nếu cần (Optionally)
        // Hiện tại để mặc định trắng cho sạch
      }

      // Check params url để hiện thông báo
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has("success")) {
        alert("Đã lưu cấu hình lịch thành công!");
        window.history.replaceState({}, document.title, "/admin/pricing");
      }
    </script>
  </body>
</html>
