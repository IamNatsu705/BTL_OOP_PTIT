<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Quản lý Giá</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out;
      }
      .fill-current {
        fill: currentColor;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <div class="flex h-screen">
      <aside class="bg-gray-800 text-gray-300 w-64 transition-all duration-300 flex flex-col flex-shrink-0">
        <div class="flex items-center justify-center h-16 border-b border-gray-700">
          <span class="text-xl font-bold text-white">Quản Trị</span>
        </div>
        <div class="bg"></div>
        <nav class="flex-1 px-4 py-6 space-y-2">
          <a th:href="@{/admin}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
            <span class="ml-3">Tổng quan</span>
          </a>
          <a th:href="@{/admin/courts}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span class="ml-3">Quản lý Sân</span>
          </a>
          <a th:href="@{/admin/pricing}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors bg-blue-600 text-white">
            <i data-lucide="tag" class="w-5 h-5"></i>
            <span class="ml-3">Quản lý Giá</span>
          </a>
          <a href="#" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="credit-card" class="w-5 h-5"></i>
            <span class="ml-3">Doanh thu</span>
          </a>
          <a th:href="@{/admin/customers}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="users" class="w-5 h-5"></i>
            <span class="ml-3">Khách hàng</span>
          </a>
          <a th:href="@{/admin/comments}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="message-square" class="w-5 h-5"></i>
            <span class="ml-3">Bình luận</span>
          </a>
        </nav>
        <div class="px-4 py-4 border-t border-gray-700">
          <a th:href="@{/logout}" class="flex items-center w-full px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="log-out" class="w-5 h-5"></i>
            <span class="ml-3">Đăng xuất</span>
          </a>
        </div>
      </aside>
      <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white shadow-sm border-b border-gray-200">
          <div class="flex items-center justify-between h-16 px-6" th:if="${isAuthenticated}">
            <button class="text-gray-600">
              <i data-lucide="menu"></i>
            </button>
            <div class="flex items-center space-x-4">
              <span class="text-gray-700 font-medium" th:text="'Chào, ' + ${currentUser}">Chào, Quản Trị Viên</span>
            </div>
          </div>
        </header>
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100">
          <div class="max-w-7xl mx-auto p-6">
            <div class="animate-fade-in">
              <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-semibold text-gray-800">Quản lý Giá (Theo khung giờ)</h2>
                <a href="#" class="flex items-center bg-blue-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-blue-700 transition-colors shadow-md">
                  <i data-lucide="plus" class="w-5 h-5 mr-2"></i>
                  Thêm Khung Giờ
                </a>
              </div>
              <div class="bg-white rounded-lg shadow-md overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                  <thead class="bg-gray-50">
                    <tr>
                      <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tên khung giờ</th>
                      <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Bắt đầu</th>
                      <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Kết thúc</th>
                      <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Áp dụng</th>
                      <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Giá (VNĐ/giờ)</th>
                      <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Hành động</th>
                    </tr>
                  </thead>
                  <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="slot : ${timeSlots}">
                      <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${slot.slot_name}">Giờ thấp điểm</td>
                      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600" th:text="${slot.start_time}">05:00:00</td>
                      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600" th:text="${slot.end_time}">16:00:00</td>
                      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600" th:text="${slot.days_apply}">weekday_morning</td>
                      <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-gray-900" th:text="${#numbers.formatDecimal(slot.price_per_hour, 0, 'COMMA', 0, 'POINT')}">
                        100,000
                      </td>
                      <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-4">
                        <a href="#" class="text-indigo-600 hover:text-indigo-900">Sửa</a>
                        <form th:action="@{/admin/pricing/delete}" method="post" style="display: inline">
                          <input type="hidden" name="id" th:value="${slot.id}" />
                          <button type="submit" class="text-red-600 hover:text-red-900" onclick="return confirm('Bạn có chắc chắn muốn xóa khung giờ này?');">Xóa</button>
                        </form>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
