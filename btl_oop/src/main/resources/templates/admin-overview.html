<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Tổng quan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <div class="flex h-screen">
      <aside class="bg-gray-800 text-gray-300 w-64 transition-all duration-300 flex flex-col flex-shrink-0">
        <div class="flex items-center justify-center h-16 border-b border-gray-700">
          <span class="text-xl font-bold text-white">Quản Trị</span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
          <a th:href="@{/admin}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors bg-blue-600 text-white">
            <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
            <span class="ml-3">Tổng quan</span>
          </a>
          <a th:href="@{/admin/courts}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span class="ml-3">Quản lý Sân</span>
          </a>
          <a th:href="@{/admin/pricing}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="tag" class="w-5 h-5"></i>
            <span class="ml-3">Quản lý Giá</span>
          </a>
          <a href="#" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="credit-card" class="w-5 h-5"></i>
            <span class="ml-3">Doanh thu</span>
          </a>
          <a th:href="@{/admin/customers}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="users" class="w-5 h-5"></i>
            <span class="ml-3">Khách hàng</span>
          </a>
          <a th:href="@{/admin/comments}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="message-square" class="w-5 h-5"></i>
            <span class="ml-3">Bình luận</span>
          </a>
        </nav>
        <div class="px-4 py-4 border-t border-gray-700">
          <a th:href="@{/logout}" class="flex items-center w-full px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white">
            <i data-lucide="log-out" class="w-5 h-5"></i>
            <span class="ml-3">Đăng xuất</span>
          </a>
        </div>
      </aside>
      <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white shadow-sm border-b border-gray-200">
          <div class="flex items-center justify-between h-16 px-6" th:if="${isAuthenticated}">
            <button class="text-gray-600">
              <i data-lucide="menu"></i>
            </button>
            <div class="flex items-center space-x-4">
              <div class=""></div>
              <span class="text-gray-700 font-medium" th:text="'Chào, ' + ${currentUser}">Chào, Quản Trị Viên</span>
            </div>
          </div>
        </header>
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100">
          <div class="max-w-7xl mx-auto p-6">
            <div class="animate-fade-in">
              <h2 class="text-3xl font-semibold text-gray-800 mb-6">Tổng quan</h2>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div class="bg-white p-6 rounded-lg shadow-md">
                  <h4 class="text-gray-500">Doanh thu (Tháng)</h4>
                  <p class="text-3xl font-bold text-green-600" th:text="${#numbers.formatDecimal(monthlyRevenue, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">125.000.000 VNĐ</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-md">
                  <h4 class="text-gray-500">Lượt đặt mới (Hôm nay)</h4>
                  <p class="text-3xl font-bold text-blue-600" th:text="${todayBookings}">32</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-md">
                  <h4 class="text-gray-500">Tổng khách hàng</h4>
                  <p class="text-3xl font-bold text-indigo-600" th:text="${totalCustomers}">0</p>
                </div>
              </div>
              <div class="bg-white p-6 rounded-lg shadow-md">
                <h4 class="text-xl font-semibold text-gray-700 mb-4">Doanh thu 7 ngày qua</h4>
                <div style="width: 100%; height: 300px">
                  <canvas id="revenueChart"></canvas>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script th:inline="javascript">
      lucide.createIcons();

      // 1. Lấy dữ liệu từ Thymeleaf
      const revenueData = /*[[${revenueData}]]*/ [];

      // 2. Chuẩn bị dữ liệu cho Chart.js
      const labels = revenueData.map((d) => d.name);
      const dataValues = revenueData.map((d) => d["Doanh thu"]);

      // 3. Lấy thẻ canvas
      const ctx = document.getElementById("revenueChart").getContext("2d");

      // 4. Vẽ biểu đồ
      new Chart(ctx, {
        type: "bar",
        data: {
          labels: labels,
          datasets: [
            {
              label: "Doanh thu",
              data: dataValues,
              backgroundColor: "rgba(59, 130, 246, 0.6)", // Màu xanh blue-500
              borderColor: "rgba(59, 130, 246, 1)",
              borderWidth: 1,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: function (value, index, values) {
                  return value.toLocaleString("vi-VN") + " VNĐ";
                },
              },
            },
          },
          plugins: {
            tooltip: {
              callbacks: {
                label: function (context) {
                  let label = context.dataset.label || "";
                  if (label) {
                    label += ": ";
                  }
                  if (context.parsed.y !== null) {
                    label += context.parsed.y.toLocaleString("vi-VN") + " VNĐ";
                  }
                  return label;
                },
              },
            },
            legend: {
              display: true,
              position: "top",
            },
          },
        },
      });
    </script>
  </body>
</html>
