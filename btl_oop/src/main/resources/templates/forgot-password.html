<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên mật khẩu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
    body { font-family: "Inter", sans-serif; }
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fade-in-up 0.5s ease-out; }
  </style>
</head>
<body class="flex flex-col min-h-screen w-full bg-gray-50">
<nav class="bg-white shadow-md sticky top-0 z-40"></nav>

<main class="flex-1">
  <div class="flex justify-center items-center py-20 md:py-32 bg-gray-50">
    <div class="w-full max-w-lg bg-white rounded-lg shadow-xl p-10 animate-fade-in-up">
      <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">
        Quên Mật Khẩu
      </h2>

      <!-- Thông báo -->
      <p th:if="${notificationMessage}" th:text="${notificationMessage}"
         th:classappend="${notificationType == 'success'} ? 'text-green-500' : 'text-red-500'"
         class="text-center mb-4"></p>

      <!-- Step 1: Nhập Email -->
      <form th:if="${step == null or step == 'email'}" th:action="@{/forgot-password}" method="post" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <div class="relative">
            <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
            <input type="email" name="email" required placeholder="vd: abc@gmail.com"
                   class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-semibold hover:bg-blue-700 transition-colors shadow-md">
          Gửi
        </button>
        <p class="text-right mt-1 text-sm text-gray-600">
          <a th:href="@{/login}" class="text-blue-600 hover:underline font-medium">Quay lại đăng nhập</a>
        </p>
      </form>

      <!-- Step 2: Nhập OTP + Mật khẩu mới -->
      <form th:if="${step == 'otp'}" th:action="@{/forgot-password/verify}" method="post" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">OTP</label>
          <input type="text" name="otp" required placeholder="Nhập mã OTP"
                 class="w-full pl-3 pr-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu mới</label>
          <input type="password" name="newPassword" required placeholder="Nhập mật khẩu mới"
                 class="w-full pl-3 pr-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nhập lại mật khẩu mới</label>
          <input type="password" name="confirmPassword" required placeholder="Nhập lại mật khẩu mới"
                 class="w-full pl-3 pr-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-semibold hover:bg-blue-700 transition-colors shadow-md">
          Đổi Mật Khẩu
        </button>
        <p class="text-right mt-1 text-sm text-gray-600">
          <a th:href="@{/login}" class="text-blue-600 hover:underline font-medium">Quay lại đăng nhập</a>
        </p>
      </form>

    </div>
  </div>
</main>

<footer class="bg-gray-800 text-gray-300 mt-16"></footer>

<script>
  lucide.createIcons();
</script>
</body>
</html>
