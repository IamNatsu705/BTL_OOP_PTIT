<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Quản lý Khách hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body class="bg-gray-100 text-gray-800 font-sans h-screen flex overflow-hidden">
    <aside class="bg-gray-800 text-gray-300 w-64 transition-all duration-300 flex flex-col flex-shrink-0">
      <div class="flex items-center justify-center h-16 border-b border-gray-700 gap-3">
        <i data-lucide="shield-check" class="w-6 h-6 text-blue-500"></i>
        <span class="text-xl font-bold text-white tracking-wide">Quản Trị</span>
      </div>
      <nav class="flex-1 px-4 py-6 space-y-2">
        <a th:href="@{/admin}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
          <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
          <span class="ml-3">Tổng quan</span>
        </a>
        <a th:href="@{/admin/courts}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
          <i data-lucide="calendar" class="w-5 h-5"></i>
          <span class="ml-3">Quản lý Lịch Sân</span>
        </a>
        <a th:href="@{/admin/pricing}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">
          <i data-lucide="tag" class="w-5 h-5"></i>
          <span class="ml-3">Quản lý Giá</span>
        </a>
        <a th:href="@{/admin/customers}" class="flex items-center w-full px-4 py-2 rounded-lg transition-colors bg-blue-600 text-white">
          <i data-lucide="users" class="w-5 h-5"></i>
          <span class="ml-3">Khách hàng</span>
        </a>
      </nav>
      <div class="px-4 py-4 border-t border-gray-700">
        <a th:href="@{/logout}" class="flex items-center w-full px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white">
          <i data-lucide="log-out" class="w-5 h-5"></i>
          <span class="ml-3">Đăng xuất</span>
        </a>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <header class="bg-white shadow-sm border-b border-gray-200 h-16 flex-shrink-0">
        <div class="flex items-center justify-between h-full px-6" th:if="${isAuthenticated}">
          <button class="text-gray-600"><i data-lucide="menu"></i></button>
          <div class="flex items-center space-x-4">
            <span class="text-gray-700 font-medium" th:text="'Chào, ' + ${currentUser}">Admin</span>
          </div>
        </div>
      </header>

      <main class="flex-1 flex flex-col p-6 overflow-hidden bg-gray-100">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6 flex-shrink-0">
          <div>
            <h2 class="text-2xl font-bold text-gray-800">Danh sách Khách hàng</h2>
          </div>

          <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="relative">
              <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <i data-lucide="search" class="w-4 h-4 text-gray-400"></i>
              </div>
              <input
                type="text"
                id="searchInput"
                onkeyup="searchTable()"
                class="block p-2 pl-10 text-sm border border-gray-300 rounded w-64 focus:outline-none focus:border-blue-500"
                placeholder="Tìm kiếm..."
              />
            </div>

            <button onclick="openModal('add')" class="flex items-center bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm font-medium">
              <i data-lucide="plus" class="w-4 h-4 mr-2"></i>
              Thêm mới
            </button>
          </div>
        </div>

        <div class="bg-white border border-gray-200 rounded shadow-sm flex-1 overflow-auto">
          <table class="w-full text-left border-collapse text-sm" id="customerTable">
            <thead class="bg-gray-50 sticky top-0 z-10 border-b border-gray-200">
              <tr>
                <th class="px-6 py-3 font-bold text-gray-600 uppercase text-xs">Thông tin</th>
                <th class="px-6 py-3 font-bold text-gray-600 uppercase text-xs">Liên hệ</th>
                <th class="px-6 py-3 font-bold text-gray-600 uppercase text-xs">Trạng thái</th>
                <th class="px-6 py-3 font-bold text-gray-600 uppercase text-xs text-right">Hành động</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
              <tr th:each="user : ${customers}" class="hover:bg-gray-50 transition-colors">
                <td class="px-6 py-4">
                  <div class="font-bold text-gray-800" th:text="${user.fullName}">Nguyen Van A</div>
                  <div class="text-xs text-gray-500 mt-1 flex items-center">
                    <i data-lucide="user" class="w-3 h-3 mr-1"></i>
                    <span th:text="${user.userName}">user123</span>
                  </div>
                </td>

                <td class="px-6 py-4">
                  <div class="flex flex-col gap-1">
                    <div class="flex items-center text-gray-600">
                      <i data-lucide="mail" class="w-3 h-3 mr-2"></i>
                      <span th:text="${user.email}">email@example.com</span>
                    </div>
                    <div class="flex items-center text-gray-600">
                      <i data-lucide="phone" class="w-3 h-3 mr-2"></i>
                      <span th:text="${user.phone}">0987654321</span>
                    </div>
                  </div>
                </td>

                <td class="px-6 py-4">
                  <span th:if="${user.status == 'ACTIVE'}" class="px-2 py-1 bg-green-100 text-green-800 text-xs font-bold rounded">Hoạt động</span>
                  <span th:unless="${user.status == 'ACTIVE'}" class="px-2 py-1 bg-red-100 text-red-800 text-xs font-bold rounded">Đã khóa</span>
                </td>

                <td class="px-6 py-4 text-right">
                  <div class="flex justify-end gap-2">
                    <button
                      th:data-id="${user.userId}"
                      th:data-fullname="${user.fullName}"
                      th:data-username="${user.userName}"
                      th:data-email="${user.email}"
                      th:data-phone="${user.phone}"
                      onclick="openModal('edit', this)"
                      class="p-2 bg-gray-100 hover:bg-blue-100 text-blue-600 rounded"
                      title="Sửa"
                    >
                      <i data-lucide="edit-2" class="w-4 h-4"></i>
                    </button>

                    <form th:action="@{/admin/customers/lock}" method="post" class="inline">
                      <input type="hidden" name="id" th:value="${user.userId}" />
                      <button type="submit" class="p-2 bg-gray-100 hover:bg-yellow-100 text-yellow-600 rounded" th:title="${user.status == 'ACTIVE' ? 'Khóa' : 'Mở khóa'}">
                        <i th:if="${user.status == 'ACTIVE'}" data-lucide="lock" class="w-4 h-4"></i>
                        <i th:unless="${user.status == 'ACTIVE'}" data-lucide="unlock" class="w-4 h-4"></i>
                      </button>
                    </form>

                    <form th:action="@{/admin/customers/delete}" method="post" class="inline">
                      <input type="hidden" name="id" th:value="${user.userId}" />
                      <button type="submit" onclick="return confirm('Xóa vĩnh viễn user này?')" class="p-2 bg-gray-100 hover:bg-red-100 text-red-600 rounded" title="Xóa">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <div id="userModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black bg-opacity-50">
      <div class="bg-white rounded-lg shadow-xl w-full max-w-lg mx-4 overflow-hidden">
        <div class="bg-blue-600 px-6 py-4 flex justify-between items-center">
          <h3 class="text-white font-bold text-lg" id="modalTitle">Thông tin Khách hàng</h3>
          <button onclick="closeModal()" class="text-blue-100 hover:text-white">
            <i data-lucide="x" class="w-6 h-6"></i>
          </button>
        </div>

        <form id="userForm" method="post" th:action="@{/admin/customers/save}" class="p-6 space-y-4">
          <input type="hidden" id="userId" name="userId" />

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Họ và tên</label>
              <input
                type="text"
                id="fullName"
                name="fullName"
                required
                class="w-full border border-gray-300 p-2 rounded focus:border-blue-500 outline-none"
                placeholder="Nguyễn Văn A"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập</label>
              <input type="text" id="userName" name="userName" required class="w-full border border-gray-300 p-2 rounded focus:border-blue-500 outline-none bg-gray-50" />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              class="w-full border border-gray-300 p-2 rounded focus:border-blue-500 outline-none"
              placeholder="email@example.com"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
            <input type="text" id="phone" name="phone" class="w-full border border-gray-300 p-2 rounded focus:border-blue-500 outline-none" placeholder="09..." />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
            <input type="password" id="password" name="password" class="w-full border border-gray-300 p-2 rounded focus:border-blue-500 outline-none" placeholder="******" />
            <p class="text-xs text-gray-500 mt-1" id="passHint">Mặc định: 123456</p>
          </div>

          <div class="pt-4 flex justify-end gap-3 border-t border-gray-100">
            <button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-50">Hủy</button>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-medium">Lưu lại</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      lucide.createIcons();

      // --- LOGIC TÌM KIẾM ---
      function searchTable() {
        const input = document.getElementById("searchInput");
        const filter = input.value.toLowerCase();
        const rows = document.querySelectorAll("#customerTable tbody tr");

        for (const row of rows) {
          const text = row.innerText.toLowerCase();

          if (text.includes(filter)) {
            row.style.display = "";
          } else {
            row.style.display = "none";
          }
        }
      }

      // --- LOGIC MODAL ---
      const modal = document.getElementById("userModal");
      const modalTitle = document.getElementById("modalTitle");
      const userForm = document.getElementById("userForm");

      // Inputs
      const inpId = document.getElementById("userId");
      const inpName = document.getElementById("fullName");
      const inpUser = document.getElementById("userName");
      const inpEmail = document.getElementById("email");
      const inpPhone = document.getElementById("phone");
      const inpPass = document.getElementById("password");
      const passHint = document.getElementById("passHint");

      function openModal(mode, btnElement = null) {
        modal.classList.remove("hidden");

        if (mode === "add") {
          modalTitle.textContent = "Thêm Khách hàng mới";
          userForm.reset();
          inpId.value = "";

          inpUser.readOnly = false; // Cho phép nhập user
          inpUser.classList.remove("bg-gray-100", "cursor-not-allowed");

          inpPass.required = true;
          passHint.textContent = "Mật khẩu là bắt buộc khi tạo mới";
        } else {
          modalTitle.textContent = "Cập nhật thông tin";

          // Fill data
          inpId.value = btnElement.getAttribute("data-id");
          inpName.value = btnElement.getAttribute("data-fullname");
          inpUser.value = btnElement.getAttribute("data-username");
          inpEmail.value = btnElement.getAttribute("data-email");
          inpPhone.value = btnElement.getAttribute("data-phone");

          // Không cho sửa Username
          inpUser.readOnly = true;
          inpUser.classList.add("bg-gray-100", "cursor-not-allowed");

          inpPass.value = "";
          inpPass.required = false;
          passHint.textContent = "Để trống nếu không muốn đổi mật khẩu";
        }
      }

      function closeModal() {
        modal.classList.add("hidden");
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });
    </script>
  </body>
</html>
