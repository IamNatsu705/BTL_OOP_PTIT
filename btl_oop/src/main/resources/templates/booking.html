<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt sân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      .booked-slot {
        pointer-events: none;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="flex flex-col min-h-screen w-full bg-gray-50">
    <nav class="bg-white shadow-md sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex-shrink-0">
            <a th:href="@{/}" class="flex items-center space-x-2">
              <img class="h-8 w-auto" src="https://img.icons8.com/color/48/badminton-2.png" alt="Logo Sân cầu lông" />
              <span class="text-xl font-bold text-gray-800">Badminton Court</span>
            </a>
          </div>

          <div class="hidden md:flex md:items-center md:space-x-4">
            <a th:href="@{/}" class="text-gray-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">Trang chủ</a>
            <a th:href="@{/booking}" class="text-blue-600 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">Đặt sân</a>
            <a th:href="@{/contact}" class="text-gray-600 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">Liên hệ</a>

            <div th:if="${isAuthenticated}">
              <div class="relative group">
                <button class="flex items-center text-gray-600 hover:text-blue-600 px-3 py-2">
                  Chào,
                  <span th:text="${currentUser}">User</span>
                  <i data-lucide="chevron-down" class="w-4 h-4 ml-1"></i>
                </button>
                <div
                  class="opacity-0 group-hover:opacity-100 invisible group-hover:visible absolute right-0 mt-0 w-48 bg-white rounded-md shadow-lg py-1 z-50 transition-all duration-200"
                >
                  <a th:if="${role == 'admin'}" th:href="@{/admin}" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Trang Quản Trị</a>
                  <a href="/profile" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Thông tin cá nhân</a>
                  <a href="/history" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Lịch sử đặt sân</a>
                  <a th:href="@{/logout}" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Đăng xuất</a>
                </div>
              </div>
            </div>

            <div th:unless="${isAuthenticated}">
              <a th:href="@{/login}" class="text-gray-600 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">Đăng nhập</a>
              <a th:href="@{/register}" class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-700 transition-colors">Đăng ký</a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <main>
      <h1 class="flex justify-center w-full text-3xl my-10 font-bold text-gray-800">Đặt sân ngay hôm nay</h1>
      <div class="flex justify-end mx-[150px] mb-4">
        <input type="date" id="bookedDate" class="border border-gray-300 rounded px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div class="overflow-auto shadow bg-white hide-scrollbar mx-[150px] rounded-lg border border-gray-200">
        <table class="min-w-full border-separate border-spacing-[1px] text-sm" id="tableSlot">
          <thead class="bg-blue-50">
            <tr>
              <th class="sticky left-0 z-20 bg-blue-100 border border-gray-300 px-4 py-3 text-gray-700 font-semibold text-center shadow-md min-w-[100px]">Sân</th>
              <th th:each="c : ${#numbers.sequence(0,23)}" class="border border-gray-300 px-2 py-3 font-semibold text-gray-700 text-center bg-blue-50 min-w-[60px]">
                <div th:if="${c>9}" class="flex items-center justify-center font-mono">
                  00:
                  <span th:text="${c}"></span>
                  h
                </div>
                <div th:if="${c<10}" class="flex items-center justify-center font-mono">
                  00:0
                  <span th:text="${c}"></span>
                  h
                </div>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="court : ${#numbers.sequence(1,6)}" class="odd:bg-white even:bg-gray-50">
              <td class="sticky left-0 z-10 bg-white border border-gray-300 px-4 py-3 font-semibold text-blue-600 text-center shadow-md">
                Sân
                <span th:text="${court}"></span>
              </td>
              <td
                th:each="slot : ${#numbers.sequence(0,23)}"
                th:data-court="${court}"
                th:data-slot="${slot}"
                th:data-price="0"
                class="border border-gray-300 px-1 py-3 text-center cursor-pointer transition select-none hover:bg-blue-100 relative group"
              ></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="mx-[150px] mt-10 p-5 bg-white shadow rounded-lg mb-10">
        <h2 class="text-xl font-bold mb-3 flex items-center gap-2">
          <i data-lucide="receipt" class="w-5 h-5"></i>
          Hóa đơn tạm tính
        </h2>
        <div id="invoiceDetail" class="text-sm border rounded p-3 bg-gray-50 min-h-[50px]">
          <p class="text-gray-500 italic">Vui lòng chọn khung giờ trên bảng.</p>
        </div>
        <div class="flex justify-between mt-4 text-lg font-bold text-gray-800">
          <span>Tổng tiền:</span>
          <span id="invoiceTotal" class="text-blue-600">0₫</span>
        </div>
        <button id="btnBook" class="mt-5 w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700 transition font-semibold disabled:opacity-50 disabled:cursor-not-allowed">
          Xác nhận đặt sân
        </button>
      </div>
    </main>

    <footer class="bg-gray-800 text-gray-300 mt-16 p-8 text-center">
      <p>&copy; 2025 Badminton Court. All rights reserved.</p>
    </footer>

    <script th:inline="javascript">
      const bookedDate = document.getElementById("bookedDate");
      bookedDate.value = new Date().toLocaleDateString("en-CA");

      const invoiceDetail = document.getElementById("invoiceDetail");
      const invoiceTotal = document.getElementById("invoiceTotal");
      const btnBook = document.getElementById("btnBook");
      const table = document.getElementById("tableSlot");

      // Cache DOM table
      const rows = table.querySelectorAll("tbody tr");
      const tableSlot = [];
      rows.forEach((row) => {
        const cell = Array.from(row.querySelectorAll("td[data-slot]"));
        tableSlot.push(cell);
      });

      const selectedSlots = [];

      // === 1. API Lấy Giá ===
      const getPriceSlots = async () => {
        const url = `/slots/price?date=${bookedDate.value}`;
        try {
          const respon = await fetch(url);
          const data = await respon.json();

          data.forEach((item) => {
            // MAPPING: DB ID (1-based) -> UI Array Index (0-based)
            const courtIndex = item.courtId - 1;
            const slotIndex = item.slotId - 1; // <--- SỬA: Trừ 1 để khớp với UI 0-23

            if (tableSlot[courtIndex] && tableSlot[courtIndex][slotIndex]) {
              const cell = tableSlot[courtIndex][slotIndex];
              cell.dataset.price = item.price;
              cell.title = `Giá: ${new Intl.NumberFormat("vi-VN").format(item.price)}đ`;
            }
          });
        } catch (error) {
          console.error("Lỗi giá:", error);
        }
      };

      // === 2. API Lấy Slot Đã Đặt ===
      const getSlotBooked = async () => {
        const url = `/slots/booked?date=${bookedDate.value}`;
        try {
          const respon = await fetch(url);
          const data = await respon.json();
          resetTableUI();

          data.forEach((item) => {
            // MAPPING: DB ID (1-based) -> UI Array Index (0-based)
            const cId = item.courId || item.courtId;
            const courtIndex = cId - 1;
            const slotIndex = item.slotId - 1; // <--- SỬA: Trừ 1 để khớp với UI 0-23

            if (tableSlot[courtIndex] && tableSlot[courtIndex][slotIndex]) {
              const cell = tableSlot[courtIndex][slotIndex];
              cell.classList.add("bg-red-500", "text-white", "cursor-not-allowed", "booked-slot");
              cell.classList.remove("hover:bg-blue-100");
              cell.title = "Đã có người đặt";
            }
          });
        } catch (error) {
          console.error("Lỗi booking:", error);
        }
      };

      // === UI Helpers ===
      const resetTableUI = () => {
        selectedSlots.length = 0;
        updateInvoice();
        tableSlot.flat().forEach((cell) => {
          cell.classList.remove("bg-blue-600", "text-white", "bg-red-500", "cursor-not-allowed", "booked-slot");
          cell.classList.add("hover:bg-blue-100");
        });
      };

      const formatCurrency = (val) => new Intl.NumberFormat("vi-VN", { style: "currency", currency: "VND" }).format(val);

      const updateInvoice = () => {
        let total = 0;
        let html = [];
        selectedSlots.sort((a, b) => a.slot - b.slot);

        selectedSlots.forEach((s) => {
          total += s.price;
          html.push(`<div class="flex justify-between py-1 border-b">
                <span>Sân ${s.court} - Giờ ${s.slot}:00</span>
                <span>${formatCurrency(s.price)}</span>
            </div>`);
        });

        if (html.length === 0) {
          invoiceDetail.innerHTML = '<p class="text-gray-500 italic">Chưa chọn khung giờ nào.</p>';
          btnBook.disabled = true;
          btnBook.classList.add("opacity-50");
        } else {
          invoiceDetail.innerHTML = html.join("");
          btnBook.disabled = false;
          btnBook.classList.remove("opacity-50");
        }
        invoiceTotal.innerText = formatCurrency(total);
      };

      const handleSlotClick = (e) => {
        const cell = e.target.closest("td");
        if (!cell || !cell.hasAttribute("data-slot") || cell.classList.contains("booked-slot")) return;

        const court = parseInt(cell.dataset.court);
        const slot = parseInt(cell.dataset.slot);
        const price = parseInt(cell.dataset.price || 0);

        // Logic 1: Chỉ chọn 1 sân
        if (selectedSlots.length > 0 && selectedSlots[0].court !== court) {
          if (confirm("Chỉ được chọn 1 sân. Chọn lại từ đầu?")) selectedSlots.length = 0;
          else return;
        }

        const idx = selectedSlots.findIndex((s) => s.slot === slot);
        if (idx >= 0) {
          selectedSlots.splice(idx, 1);
          cell.classList.remove("bg-blue-600", "text-white");
        } else {
          // Logic 2: Chọn liên tiếp
          const temp = [...selectedSlots, { slot }].sort((a, b) => a.slot - b.slot);
          for (let i = 0; i < temp.length - 1; i++) {
            if (temp[i + 1].slot - temp[i].slot !== 1) {
              alert("Phải chọn giờ liên tiếp!");
              return;
            }
          }
          selectedSlots.push({ court, slot, price, element: cell });
          cell.classList.add("bg-blue-600", "text-white");
        }
        updateInvoice();
      };

      // === 3. Gửi Booking ===
      const sendBookingRequest = async () => {
        if (selectedSlots.length === 0) return;

        const params = new URLSearchParams();
        params.append("courtId", selectedSlots[0].court);
        params.append("date", bookedDate.value);

        // MAPPING: UI Index (0-based) -> DB ID (1-based)
        // Slot 0 (0h-1h) -> ID 1
        const ids = selectedSlots.map((s) => s.slot + 1).join(",");
        params.append("slotIds", ids);

        btnBook.disabled = true;
        btnBook.innerText = "Đang xử lý...";

        try {
          const res = await fetch("/booking/create", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params,
          });
          const text = await res.text();
          if (text === "SUCCESS") {
            alert("Đặt sân thành công!");
            window.location.href = "/history";
          } else if (text === "REDIRECT_LOGIN") {
            window.location.href = "/login";
          } else {
            alert("Lỗi: " + text);
            btnBook.disabled = false;
            btnBook.innerText = "Xác nhận đặt sân";
          }
        } catch (e) {
          console.error(e);
          alert("Lỗi kết nối!");
          btnBook.disabled = false;
          btnBook.innerText = "Xác nhận đặt sân";
        }
      };

      // Init
      table.addEventListener("click", handleSlotClick);
      btnBook.addEventListener("click", sendBookingRequest);
      bookedDate.addEventListener("change", async () => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        if (new Date(bookedDate.value) < today) {
          alert("Không chọn ngày quá khứ");
          bookedDate.value = new Date().toLocaleDateString("en-CA");
          return;
        }
        await getPriceSlots();
        await getSlotBooked();
      });

      (async () => {
        await getPriceSlots();
        await getSlotBooked();
        lucide.createIcons();
      })();
    </script>
  </body>
</html>
